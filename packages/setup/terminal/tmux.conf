# ~/.config/tmux/tmux.conf — generated by scuttlarr; edit the overlay, not this file.
# Overlay: ~/.config/scuttlarr/tmux.conf is inserted before the theme line.

# Terminal: true colour, Ghostty-aware.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Sensible defaults (formerly tmux-sensible).
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on
setw -g aggressive-resize on
set -g status-keys emacs
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Human-friendly numbering for windows and panes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Flat status bar; the colours are the theme's (below).
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 32
set -g status-right-length 80
set -g mouse on

# Sesh: smart tmux session switching.
set -g detach-on-destroy off
bind-key T display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "sesh picker -i -t"
bind-key L run-shell "sesh last"
bind-key 9 run-shell "sesh connect --root '#{pane_current_path}'"

# Colours from the current theme; `-q` keeps a fresh install quiet until one renders.
source-file -q ~/.local/state/scuttlarr/current/theme/tmux.conf
