[package]
name = "scuttlarr"
version = "0.6.0"
description = "Scuttle the ship. Sail the wreck. An opinionated macOS desktop for terminal developers"
authors = ["Mitch Malone"]
edition = "2021"

[lib]
name = "scuttlarr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "macos-private-api",
  "protocol-asset",
  "tray-icon",
  "image-png",
] }
tauri-plugin-global-shortcut = "2"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
dirs = "6"
thiserror = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSResponder",
  "NSWorkspace",
  "NSRunningApplication",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphics",
  "NSPasteboard",
  "NSScreen",
  "NSColor",
  "NSColorSpace",
  "NSColorSampler",
  "NSEvent",
  "block2",
  "objc2-core-foundation",
] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSData", "NSDictionary", "NSProcessInfo", "NSObjCRuntime", "NSGeometry"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "jpeg"] }
tauri-plugin-autostart = "2.5.1"
ureq = "2"
sha2 = "0.10"
url = "2.5.8"
plist = "1.10.0"
security-framework = "3"
